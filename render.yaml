services:
  # ── Backend API (Node.js) ──────────────────────────────────────────
  - type: web
    name: shoppulse-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm start
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: APIFY_API_TOKEN
        sync: false          # Render dashboard-da əl ilə daxil et
      - key: APIFY_ACTOR_ID
        value: clockworks/free-tiktok-scraper
      - key: OPENAI_API_KEY
        sync: false          # Render dashboard-da əl ilə daxil et
      - key: SUPABASE_URL
        sync: false          # Render dashboard-da əl ilə daxil et
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false          # Render dashboard-da əl ilə daxil et
      - key: MOCK_EXTERNAL_APIS
        value: false

  # ── Frontend Static Site ───────────────────────────────────────────
  - type: web
    name: shoppulse-frontend
    runtime: static
    buildCommand: echo "No build needed"
    staticPublishPath: .
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
